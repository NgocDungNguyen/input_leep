# Input Leap config for two laptops.
#
#   +-----------+  +-----------+
#   | laptop-a  |  | laptop-b  |
#   | (server,  |  | (client)  |
#   | keyboard) |  |           |
#   +-----------+  +-----------+
#
# Replace laptop-a / laptop-b with the "Screen name" each laptop shows in the
# Input Leap window (by default, its hostname). Names are case-sensitive.
# If laptop-b sits to the LEFT of laptop-a, swap "right" and "left" below.

section: screens
	laptop-a:
	laptop-b:
end

section: links
	laptop-a:
		right = laptop-b
	laptop-b:
		left = laptop-a
end

section: options
	# Wait 250 ms at the edge before switching, so you don't jump screens by accident.
	switchDelay = 250
	# Share the clipboard between the laptops (not supported on Linux/Wayland).
	clipboardSharing = true
end
